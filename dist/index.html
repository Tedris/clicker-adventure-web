      html, body { margin: 0; padding: 0; height: 100%; background: #1a1a2e; overflow: hidden; }

  <body>
    <!-- GitHub Pages serves repo root: forward to the built bundle in dist/.
         Guarded so dist/index.html itself (same template) does not re-loop. -->
    <script>
      if (!/(^|\/)dist\/index\.html$/.test(location.pathname)) {
        location.replace("dist/index.html");
      }
    </script>
    <div id="app"></div>
  </body>
